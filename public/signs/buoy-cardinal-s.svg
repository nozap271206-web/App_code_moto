<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <rect x="0" y="72" width="96" height="24" fill="#B8D9F0" opacity="0.45"/>
  <line x1="48" y1="74" x2="48" y2="88" stroke="#888" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- Buoy body: upper half yellow, lower half black -->
  <rect x="30" y="43" width="36" height="15" rx="3" fill="#1A1A1A" stroke="#000" stroke-width="1.5"/>
  <rect x="30" y="58" width="36" height="14" rx="3" fill="#FFD700" stroke="#CCAA00" stroke-width="1.5"/>
  <!-- Mast -->
  <line x1="48" y1="18" x2="48" y2="43" stroke="#555" stroke-width="2"/>
  <!-- Topmark: two cones pointing DOWN (▽▽) -->
  <polygon points="38,8 58,8 48,19" fill="#1A1A1A" stroke="#000" stroke-width="1"/>
  <polygon points="38,19 58,19 48,30" fill="#1A1A1A" stroke="#000" stroke-width="1"/>
</svg>
