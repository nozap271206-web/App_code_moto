<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <rect x="0" y="72" width="96" height="24" fill="#B8D9F0" opacity="0.45"/>
  <line x1="48" y1="74" x2="48" y2="88" stroke="#888" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- Buoy body: red and white vertical stripes (4 bands) -->
  <rect x="30" y="43" width="36" height="29" rx="4" fill="white" stroke="#AAA" stroke-width="1.5"/>
  <rect x="30" y="43" width="9" height="29" fill="#CC1111" rx="0"/>
  <rect x="48" y="43" width="9" height="29" fill="#CC1111"/>
  <rect x="30" y="43" width="36" height="29" rx="4" fill="none" stroke="#AAA" stroke-width="1.5"/>
  <!-- Mast -->
  <line x1="48" y1="18" x2="48" y2="43" stroke="#555" stroke-width="2"/>
  <!-- Topmark: red sphere -->
  <circle cx="48" cy="12" r="7" fill="#CC1111" stroke="#991111" stroke-width="1.5"/>
</svg>
