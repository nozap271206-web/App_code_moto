<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <rect x="0" y="72" width="96" height="24" fill="#B8D9F0" opacity="0.45"/>
  <line x1="48" y1="74" x2="48" y2="88" stroke="#888" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- Buoy body: YBY (yellow/black/yellow top to bottom) -->
  <rect x="30" y="43" width="36" height="9" rx="2" fill="#FFD700" stroke="#CCAA00" stroke-width="1.5"/>
  <rect x="30" y="52" width="36" height="9" fill="#1A1A1A" stroke="#000" stroke-width="1.5"/>
  <rect x="30" y="61" width="36" height="11" rx="2" fill="#FFD700" stroke="#CCAA00" stroke-width="1.5"/>
  <!-- Mast -->
  <line x1="48" y1="16" x2="48" y2="43" stroke="#555" stroke-width="2"/>
  <!-- Topmark: two cones point to point (⌛ hourglass) -->
  <polygon points="38,7 58,7 48,16" fill="#1A1A1A" stroke="#000" stroke-width="1"/>
  <polygon points="48,16 38,25 58,25" fill="#1A1A1A" stroke="#000" stroke-width="1"/>
</svg>
