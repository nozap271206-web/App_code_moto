  <!-- Buoy body: black with red band -->
  <rect x="30" y="43" width="36" height="12" rx="3" fill="#1A1A1A" stroke="#000" stroke-width="1.5"/>
  <rect x="30" y="55" width="36" height="10" fill="#CC1111" stroke="#991111" stroke-width="1.5"/>
  <rect x="30" y="65" width="36" height="7" rx="3" fill="#1A1A1A" stroke="#000" stroke-width="1.5"/>
  <!-- Mast -->
  <line x1="48" y1="18" x2="48" y2="43" stroke="#555" stroke-width="2"/>
  <!-- Topmark: two black spheres -->
  <circle cx="48" cy="9" r="5" fill="#1A1A1A" stroke="#000" stroke-width="1"/>
  <circle cx="48" cy="20" r="5" fill="#1A1A1A" stroke="#000" stroke-width="1"/>
